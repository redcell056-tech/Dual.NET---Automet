---
- name: Backup completo y envío al servidor de backup
  hosts: linux,ubuntu
  gather_facts: yes
  become: yes
  become_method: sudo
  become_flags: '-H -S -n'

  vars:
    ansible_become_password: "!Urielito2001"

    backup_source_dirs:
      - /etc
      - /home
      - /var/log
      - /opt

    backup_exclude_paths:
      - /proc
      - /sys
      - /dev
      - /run
      - /tmp
      - /var/cache
      - /var/lib/docker

    # IP literal del servidor de backup (la del host con etiqueta backup)
    backup_server_ip: "192.168.1.101"
    backup_server_user: "redcell"
    backup_server_password: "!Urielito2001"
    backup_base_dir: "/backup"
    backup_date: "{{ ansible_date_time.date }}"

  tasks:
    - name: Crear archivo comprimido de backup
      ansible.builtin.archive:
        path: "{{ backup_source_dirs }}"
        dest: "/tmp/{{ inventory_hostname }}-full-backup-{{ backup_date }}.tar.gz"
        format: gz
        force_archive: yes
        exclude_path: "{{ backup_exclude_paths }}"
      register: archive_result

    - name: Crear directorio en el servidor de backup
      ansible.builtin.shell: |
        sshpass -p '{{ backup_server_password }}' ssh -o StrictHostKeyChecking=no {{ backup_server_user }}@{{ backup_server_ip }} \
          "echo '{{ backup_server_password }}' | sudo -S mkdir -p {{ backup_base_dir }}/{{ inventory_hostname }}"
      delegate_to: "{{ inventory_hostname }}"

    - name: Enviar el backup al servidor de backup con scp
      ansible.builtin.shell: |
        sshpass -p '{{ backup_server_password }}' scp -o StrictHostKeyChecking=no \
          {{ archive_result.dest }} {{ backup_server_user }}@{{ backup_server_ip }}:/tmp/{{ inventory_hostname }}-full-backup-{{ backup_date }}.tar.gz
        sshpass -p '{{ backup_server_password }}' ssh -o StrictHostKeyChecking=no {{ backup_server_user }}@{{ backup_server_ip }} \
          "echo '{{ backup_server_password }}' | sudo -S mv /tmp/{{ inventory_hostname }}-full-backup-{{ backup_date }}.tar.gz {{ backup_base_dir }}/{{ inventory_hostname }}/"
      delegate_to: "{{ inventory_hostname }}"

    - name: Eliminar el archivo temporal del host de origen
      ansible.builtin.file:
        path: "{{ archive_result.dest }}"
        state: absent

    - name: Verificar que el backup llegó al servidor
      ansible.builtin.shell: |
        sshpass -p '{{ backup_server_password }}' ssh -o StrictHostKeyChecking=no {{ backup_server_user }}@{{ backup_server_ip }} \
          "ls -lh {{ backup_base_dir }}/{{ inventory_hostname }}/{{ inventory_hostname }}-full-backup-{{ backup_date }}.tar.gz"
      delegate_to: "{{ inventory_hostname }}"
      register: backup_check
      failed_when: backup_check.rc != 0

    - name: Mostrar resultado del backup
      ansible.builtin.debug:
        msg: >-
          Backup de {{ inventory_hostname }}:
          OK ({{ backup_check.stdout }})
          guardado en {{ backup_server_ip }}:{{ backup_base_dir }}/{{ inventory_hostname }}/