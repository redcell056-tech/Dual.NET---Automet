---
- name: Backup completo y envío al servidor con etiqueta backup
  hosts: linux,ubuntu
  gather_facts: yes
  become: yes
  become_method: sudo
  become_flags: '-H -S -n'

  vars:
    ansible_become_password: "{{ ansible_password }}"

    backup_source_dirs:
      - /etc
      - /home
      - /var/log
      - /opt

    backup_exclude_paths:
      - /proc
      - /sys
      - /dev
      - /run
      - /tmp
      - /var/cache
      - /var/lib/docker

    # El host con etiqueta 'backup' en el inventario
    backup_server: "{{ groups['backup'][0] }}"
    backup_base_dir: "/backup"
    backup_date: "{{ ansible_date_time.date }}"

  tasks:
    - name: Crear archivo comprimido de backup
      ansible.builtin.archive:
        path: "{{ backup_source_dirs }}"
        dest: "/tmp/{{ inventory_hostname }}-full-backup-{{ backup_date }}.tar.gz"
        format: gz
        force_archive: yes
        exclude_path: "{{ backup_exclude_paths }}"
      register: archive_result

    - name: Crear directorio en el servidor de backup
      ansible.builtin.file:
        path: "{{ backup_base_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      delegate_to: "{{ backup_server }}"

    - name: Enviar el backup al servidor de backup
      ansible.posix.synchronize:
        src: "{{ archive_result.dest }}"
        dest: "{{ backup_server }}:{{ backup_base_dir }}/{{ inventory_hostname }}/"
        mode: push
        archive: yes
        compress: yes
      delegate_to: "{{ inventory_hostname }}"

    - name: Eliminar el archivo temporal del host de origen
      ansible.builtin.file:
        path: "{{ archive_result.dest }}"
        state: absent

    - name: Verificar que el backup llegó al servidor
      ansible.builtin.stat:
        path: "{{ backup_base_dir }}/{{ inventory_hostname }}/{{ inventory_hostname }}-full-backup-{{ backup_date }}.tar.gz"
      delegate_to: "{{ backup_server }}"
      register: backup_check

    - name: Mostrar resultado del backup
      ansible.builtin.debug:
        msg: >-
          Backup de {{ inventory_hostname }}:
          {{ 'OK' if backup_check.stat.exists else 'FALLÓ' }}
          ({{ backup_check.stat.size | default(0) | filesizeformat }})
          guardado en {{ backup_server }}:{{ backup_base_dir }}/{{ inventory_hostname }}/