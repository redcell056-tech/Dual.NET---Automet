---
- name: Crear VM (Prueba con Ubuntu) en ESXi via SSH
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: "!Urielito2001"
    vm_name: "rocky-gui-01"
    datastore: "datastore1"
    # ⚠️ Usando el nombre exacto que me mostraste
    iso_rel_path: "ISOS/ubuntu-24.04.2-live-server-amd64.iso"

  tasks:
    # 1. Crear la VM
    - name: Crear la VM en ESXi
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "ubuntu64Guest"  # Cambiado a Ubuntu
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048
          num_cpus: 2
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result
      vars:
        ansible_python_interpreter: /usr/local/bin/python

    - name: Mostrar resultado de creación
      debug:
        msg: "VM creada correctamente."

    # 2. Corregir el .vmx a fondo vía SSH y encender la VM
    - name: Corregir CD-ROM y orden de arranque en el ESXi
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}')
        if [ -z "$VMID" ]; then
          echo "ERROR: No se encontró la VM {{ vm_name }}"
          exit 1
        fi
        echo "VMID detectado: $VMID"

        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 2

        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        # Limpieza profunda (borra TODO lo que tenga que ver con CD-ROM y arranque)
        sed -i '/^ide[01]:[0-9]\./d' "$VMX"
        sed -i '/^sata[0-9]:[0-9]\./d' "$VMX"
        sed -i '/^bios.bootOrder/d' "$VMX"
        sed -i '/^bios.bootDeviceClasses/d' "$VMX"
        sed -i '/^firmware/d' "$VMX"

        # Insertar configuración correcta (Forzando BIOS y ruta con corchetes)
        cat >> "$VMX" << 'EOF'
        firmware = "bios"
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.fileName = "[{{ datastore }}] {{ iso_rel_path }}"
        ide0:0.startConnected = "TRUE"
        bios.bootOrder = "cdrom,hd"
        bios.bootDeviceClasses = "allow:cd,hd"
        EOF

        echo "=== Configuración aplicada ==="
        grep -E "firmware|ide0:0|bios.boot" "$VMX"

        vim-cmd vmsvc/reload $VMID
        sleep 2
        vim-cmd vmsvc/power.on $VMID

        echo "VM encendida correctamente."
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'