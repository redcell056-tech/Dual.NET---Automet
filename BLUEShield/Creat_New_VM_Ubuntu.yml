---
- name: Crear VM Ubuntu y configurar Autoinstall
  hosts: localhost
  gather_facts: no
  vars:
    esxi_hostname: "192.168.1.67"
    datacenter_name: "ha-datacenter"
    datastore_name: "datastore1"
    vm_name: "Ubuntu-Server-Auto"
    iso_path: "[datastore1] ISOS/ubuntu-24.04.2-live-server-amd64.iso"
    
    esxi_username: "{{ ansible_user }}"
    esxi_password: "{{ ansible_password }}"

  tasks:
    - name: Crear la Máquina Virtual en ESXi
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: no
        datacenter: "{{ datacenter_name }}"
        folder: "/"
        name: "{{ vm_name }}"
        state: poweredon
        guest_id: "ubuntu64Guest"
        hardware:
          num_cpus: 1
          memory_mb: 1024
          networks:
            - name: "VM Network"
          cdroms:
            - type: "iso"
              iso_path: "{{ iso_path }}"
              controller_type: "ide"
        disk:
          - size_gb: 20
            type: thin
            datastore: "{{ datastore_name }}"
      register: vm_info

    - name: Inyectar configuración de Autoinstall
      community.vmware.vmware_guest:
        hostname: "{{ esxi_hostname }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: no
        datacenter: "{{ datacenter_name }}"
        name: "{{ vm_name }}"
        state: present
        advanced_settings:
          - key: "guestinfo.userdata"
            value: |
              #cloud-config
              autoinstall:
                version: 1
                locale: es_ES.UTF-8
                keyboard:
                  layout: es
                timezone: Europe/Madrid
                identity:
                  hostname: ubuntu-auto
                  username: root
                  password: '$6$rounds=4096$N9x8vJ2k$U2F6fL7s8/4m.5X9aZ3b1C6d8E0f2G4h6J8k0L2m4N6p8Q0r2S4t6U8v0W2x4Y6z8A0b2C4d6E8f0G2h4I6j8K0l2'
                ssh:
                  install-server: true
                  allow-pw: true
                network:
                  version: 2
                  ethernets:
                    ens192:
                      dhcp4: true
                storage:
                  layout:
                    name: direct
                packages:
                  - openssh-server
          - key: "guestinfo.userdata.encoding"
            value: "base64"