---
- name: Crear VM Ubuntu en ESXi y configurar autoinstall con cloud-init
  hosts: localhost
  gather_facts: no
  vars:
    esxi_host: "{{ ansible_host }}"
    esxi_user: "{{ ansible_user }}"
    esxi_pass: "{{ ansible_password }}"
    vm_name: "Ubuntu-Server-Auto"
    datastore: "datastore1"
    iso_path: "[datastore1] ISOS/ubuntu-24.04.2-live-server-amd64.iso"
    vm_mem_mb: 1024
    vm_cpus: 1
    vm_net: "VM Network"
    userdata_content: |
      #cloud-config
      autoinstall:
        version: 1
        identity:
          hostname: ubuntu-auto
          username: ubuntu
          password: "$6$rounds=4096$saltsalt$hash..."
        ssh:
          install-server: true

  tasks:
    - name: Asegurar que el userdata esté codificado en base64
      ansible.builtin.set_fact:
        userdata_b64: "{{ userdata_content | b64encode }}"
        metadata_b64: "{{ {'instance-id': 'ubuntu-auto-01'} | to_json | b64encode }}"

    - name: Crear, configurar y encender la VM usando vmware_guest
      community.vmware.vmware_guest:
        hostname: "{{ esxi_host }}"
        username: "{{ esxi_user }}"
        password: "{{ esxi_pass }}"
        validate_certs: no
        name: "{{ vm_name }}"
        datacenter: "ha-datacenter"
        folder: "/"
        guest_id: "ubuntu64Guest"
        hardware:
          memory_mb: "{{ vm_mem_mb }}"
          num_cpus: "{{ vm_cpus }}"
        disk:
          - size_gb: 20
            type: thin
            datastore: "{{ datastore }}"
        networks:
          - name: "{{ vm_net }}"
            device_type: vmxnet3
        cdrom:
          - type: iso
            iso_path: "{{ iso_path }}"
            controller_number: 0
            unit_number: 0
            state: present
        advanced_settings:
          - key: "guestinfo.userdata"
            value: "{{ userdata_b64 }}"
          - key: "guestinfo.userdata.encoding"
            value: "base64"
          - key: "guestinfo.metadata"
            value: "{{ metadata_b64 }}"
          - key: "guestinfo.metadata.encoding"
            value: "base64"
        state: poweredon
        wait_for_ip_address: no
      delegate_to: localhost