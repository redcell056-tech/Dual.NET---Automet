---
- name: Crear VM Ubuntu en ESXi vía SSH con autoinstall (ESXi gratuito)
  hosts: localhost
  gather_facts: no
  vars:
    esxi_host: "{{ ansible_host }}"
    esxi_user: "{{ ansible_user }}"
    esxi_pass: "{{ ansible_password }}"
    vm_name: "Ubuntu-Server-Auto"
    datastore: "datastore1"
    vm_dir: "/vmfs/volumes/{{ datastore }}/{{ vm_name }}"
    vmx_path: "{{ vm_dir }}/{{ vm_name }}.vmx"
    vmdk_path: "{{ vm_dir }}/{{ vm_name }}.vmdk"
    iso_path: "[datastore1] ISOS/ubuntu-24.04.2-live-server-amd64.iso"
    vm_mem_mb: 1024
    vm_cpus: 1
    vm_net: "VM Network"
    userdata_content: |
      #cloud-config
      autoinstall:
        version: 1
        identity:
          hostname: ubuntu-auto
          username: ubuntu
          password: "$6$rounds=4096$saltsalt$hash..."
        ssh:
          install-server: true

  tasks:
    - name: Codificar userdata y metadata en base64
      ansible.builtin.set_fact:
        userdata_b64: "{{ userdata_content | b64encode }}"
        metadata_b64: "{{ {'instance-id': 'ubuntu-auto-01'} | to_json | b64encode }}"

    - name: 1. Crear directorio de la VM
      ansible.builtin.shell: |
        mkdir -p "{{ vm_dir }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    - name: 2. Crear disco virtual thin de 20G
      ansible.builtin.shell: |
        vmkfstools -c 20G -a lsilogic -d thin "{{ vmdk_path }}"
      args:
        creates: "{{ vmdk_path }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 3. Crear VM ficticia (genera esqueleto vmx)
      ansible.builtin.shell: |
        vim-cmd vmsvc/createdummyvm "{{ vm_name }}" "/vmfs/volumes/{{ datastore }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 4. Escribir configuración completa del vmx
      ansible.builtin.shell: |
        cat > "{{ vmx_path }}" <<'VMXEOF'
        .encoding = "UTF-8"
        config.version = "8"
        virtualHW.version = "20"
        displayName = "{{ vm_name }}"
        guestOS = "ubuntu-64"
        numvcpus = "{{ vm_cpus }}"
        memSize = "{{ vm_mem_mb }}"

        scsi0.present = "TRUE"
        scsi0.virtualDev = "lsilogic"
        scsi0:0.present = "TRUE"
        scsi0:0.fileName = "{{ vm_name }}.vmdk"
        scsi0:0.deviceType = "scsi-hardDisk"

        ethernet0.present = "TRUE"
        ethernet0.virtualDev = "vmxnet3"
        ethernet0.networkName = "{{ vm_net }}"
        ethernet0.addressType = "generated"

        sata0.present = "TRUE"
        sata0:0.present = "TRUE"
        sata0:0.deviceType = "cdrom-image"
        sata0:0.fileName = "{{ iso_path }}"
        VMXEOF
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 5. Verificar si la VM ya está registrada (por nombre)
      ansible.builtin.shell: |
        vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}'
      delegate_to: "{{ esxi_host }}"
      register: existing_vmid
      changed_when: false
      failed_when: false
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 5b. Registrar la VM solo si no existe
      ansible.builtin.shell: |
        vim-cmd solo/registervm "{{ vmx_path }}"
      delegate_to: "{{ esxi_host }}"
      when: existing_vmid.stdout == ""
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 6. Obtener vmid de la VM
      ansible.builtin.shell: |
        vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}'
      delegate_to: "{{ esxi_host }}"
      register: vmid_result
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 7. Inyectar guestinfo.userdata y guestinfo.metadata con govc (desde el backend)
      ansible.builtin.shell: |
        govc vm.change -vm "{{ vm_name }}" \
          -e guestinfo.userdata="{{ userdata_b64 }}" \
          -e guestinfo.userdata.encoding=base64 \
          -e guestinfo.metadata="{{ metadata_b64 }}" \
          -e guestinfo.metadata.encoding=base64
      environment:
        GOVC_URL: "https://{{ esxi_host }}"
        GOVC_USERNAME: "{{ esxi_user }}"
        GOVC_PASSWORD: "{{ esxi_pass }}"
        GOVC_INSECURE: "1"
      delegate_to: localhost

    - name: 8. Encender la VM
      ansible.builtin.shell: |
        vim-cmd vmsvc/power.on {{ vmid_result.stdout }}
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"