---
- name: Crear VM Ubuntu en ESXi vía SSH (sin API, usando ansible_host)
  hosts: localhost
  gather_facts: no
  vars:
    esxi_host: "{{ ansible_host }}"
    esxi_user: "{{ ansible_user }}"
    esxi_pass: "{{ ansible_password }}"
    vm_name: "Ubuntu-Server-Auto"
    datastore: "datastore1"
    vm_dir: "/vmfs/volumes/{{ datastore }}/{{ vm_name }}"
    vmx_path: "{{ vm_dir }}/{{ vm_name }}.vmx"
    vmdk_path: "{{ vm_dir }}/{{ vm_name }}.vmdk"
    iso_path: "[datastore1] ISOS/ubuntu-24.04.2-live-server-amd64.iso"
    vm_mem_mb: 1024
    vm_cpus: 1
    vm_net: "VM Network"
    # userdata en base64 para Autoinstall
    userdata_b64: "{{ lookup('template', 'userdata.yml.j2') | b64encode }}"

  tasks:
    - name: 1. Crear directorio de la VM
      ansible.builtin.shell: |
        mkdir -p "{{ vm_dir }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

    - name: 2. Crear disco virtual thin de 20G
      ansible.builtin.shell: |
        vmkfstools -c 20G -a lsilogic -d thin "{{ vmdk_path }}"
      args:
        creates: "{{ vmdk_path }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 3. Crear VM ficticia (genera esqueleto vmx)
      ansible.builtin.shell: |
        vim-cmd vmsvc/createdummyvm "{{ vm_name }}" "/vmfs/volumes/{{ datastore }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 4. Escribir configuración completa del vmx
      ansible.builtin.shell: |
        cat > "{{ vmx_path }}" <<'VMXEOF'
        .encoding = "UTF-8"
        config.version = "8"
        virtualHW.version = "20"
        displayName = "{{ vm_name }}"
        guestOS = "ubuntu-64"
        numvcpus = "{{ vm_cpus }}"
        memSize = "{{ vm_mem_mb }}"

        scsi0.present = "TRUE"
        scsi0.virtualDev = "lsilogic"
        scsi0:0.present = "TRUE"
        scsi0:0.fileName = "{{ vm_name }}.vmdk"
        scsi0:0.deviceType = "scsi-hardDisk"

        ethernet0.present = "TRUE"
        ethernet0.virtualDev = "vmxnet3"
        ethernet0.networkName = "{{ vm_net }}"
        ethernet0.addressType = "generated"

        sata0.present = "TRUE"
        sata0:0.present = "TRUE"
        sata0:0.deviceType = "cdrom-image"
        sata0:0.fileName = "{{ iso_path }}"

        guestinfo.userdata = "{{ userdata_b64 }}"
        guestinfo.userdata.encoding = "base64"
        VMXEOF
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 5. Registrar la VM
      ansible.builtin.shell: |
        vim-cmd solo/registervm "{{ vmx_path }}"
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"

    - name: 6. Encender la VM
      ansible.builtin.shell: |
        vmid=$(vim-cmd vmsvc/getallvms | grep "{{ vm_name }}" | awk '{print $1}')
        vim-cmd vmsvc/power.on $vmid
      delegate_to: "{{ esxi_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ esxi_user }}"
        ansible_password: "{{ esxi_pass }}"