---
- name: Crear VM Ubuntu con autoinstall via SSH + ISO de seed
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "{{ ansible_host }}"
    esxiuser: "{{ ansible_user }}"
    esxipass: "{{ ansible_password }}"
    vm_name: "ubuntu-auto"
    datastore: "datastore1"
    iso_path: "datastore1/ISOS/ubuntu-24.04.2-live-server-amd64.iso"
    seed_iso_datastore: "datastore1/{{ vm_name }}/seed.iso"
    seed_iso_local: "/tmp/seed.iso"

  tasks:
    - name: 1. Generar ISO de seed con user-data
      ansible.builtin.shell: |
        mkdir -p /tmp/seed_build
        cat > /tmp/seed_build/user-data <<'EOF'
        #cloud-config
        autoinstall:
          version: 1
          identity:
            hostname: ubuntu-auto
            username: ubuntu
            password: "$6$rounds=4096$saltsalt$hash..."
          ssh:
            install-server: true
        EOF
        cat > /tmp/seed_build/meta-data <<'EOF'
        instance-id: ubuntu-auto-01
        local-hostname: ubuntu-auto
        EOF
        genisoimage -output {{ seed_iso_local }} -volid cidata -joliet -rock /tmp/seed_build/user-data /tmp/seed_build/meta-data

    - name: 2. Crear VM con zaki_lknr.esxissh (primer CD: ISO instalación)
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "ubuntu64Guest"
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 1024
          num_cpus: 1
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: vmxnet3
        cdrom:
          - type: iso
            iso_path: "{{ iso_path }}"
        state: present

    - name: 3. Subir ISO de seed al datastore por SFTP (Paramiko)
      ansible.builtin.shell: |
        python3 - << 'PYEOF'
        import paramiko
        client = paramiko.SSHClient()
        client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
        client.connect("{{ esxiaddr }}", username="{{ esxiuser }}", password="{{ esxipass }}")
        sftp = client.open_sftp()
        sftp.put("{{ seed_iso_local }}", "/vmfs/volumes/{{ datastore }}/{{ vm_name }}/seed.iso")
        sftp.close()
        client.close()
        PYEOF

    - name: 4. Añadir segundo CD-ROM (seed) al vmx por SSH
      ansible.builtin.shell: |
        python3 - << 'PYEOF'
        import paramiko
        client = paramiko.SSHClient()
        client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
        client.connect("{{ esxiaddr }}", username="{{ esxiuser }}", password="{{ esxipass }}")
        vmx = "/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"
        cmd = f'echo "sata0:1.present = \\"TRUE\\"" >> {vmx}; echo "sata0:1.deviceType = \\"cdrom-image\\"" >> {vmx}; echo "sata0:1.fileName = \\"/vmfs/volumes/{{ datastore }}/{{ vm_name }}/seed.iso\\"" >> {vmx}'
        stdin, stdout, stderr = client.exec_command(cmd)
        print(stderr.read().decode())
        client.close()
        PYEOF

    - name: 5. Encender la VM
      zaki_lknr.esxissh.esxissh_guest_power:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        state: poweredon