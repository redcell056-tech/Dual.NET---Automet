---
- name: Crear VM Ubuntu con la receta de Zabbix
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: "!Urielito2001"
    vm_name: "ubuntu-gui-final"
    datastore: "datastore1"
    iso_rel_path: "ISOS/ubuntu-24.04.2-live-server-amd64.iso"

  tasks:
    # 1. Crear la VM
    - name: Crear la VM en ESXi
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "ubuntu64Guest"
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048
          num_cpus: 2
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result
      vars:
        ansible_python_interpreter: /usr/local/bin/python

    # 2. Corregir el .vmx para que quede IGUAL que Zabbix
    - name: Corregir CD-ROM (Estilo Zabbix) en el ESXi
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}')
        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 2

        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        # 1. Limpiamos cualquier cosa que haya puesto Ansible
        sed -i '/^ide[01]:[0-9]\./d' "$VMX"
        sed -i '/^sata[0-9]:[0-9]\./d' "$VMX"
        sed -i '/^firmware/d' "$VMX"
        sed -i '/^bios.bootOrder/d' "$VMX"
        sed -i '/^bios.bootDeviceClasses/d' "$VMX"

        # 2. Escribimos EXACTAMENTE lo que tiene Zabbix
        cat >> "$VMX" << 'EOF'
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.filename = "/vmfs/volumes/{{ datastore }}/{{ iso_rel_path }}"
        EOF

        echo "=== Configuración final aplicada ==="
        grep -E "ide0:0" "$VMX"

        # 3. Encendemos
        vim-cmd vmsvc/reload $VMID
        sleep 2
        vim-cmd vmsvc/power.on $VMID
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'