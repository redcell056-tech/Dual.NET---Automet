---
- name: Reinstalar Passbolt CE en Ubuntu desde cero
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Solo el dominio/IP de acceso. Sobreescribible con -e passbolt_domain=...
    passbolt_domain: "{{ ansible_default_ipv4.address | default('localhost') }}"

    # Credenciales: NO se definen aquí.
    # Deben venir de Ansible Vault, group_vars/host_vars cifrados o -e:
    #   -e passbolt_db_name=... -e passbolt_db_user=... -e passbolt_db_password=...

  tasks:
    # ============ 0. VALIDAR CREDENCIALES ============
    - name: 0.1 Verificar que las variables de BD están definidas
      ansible.builtin.assert:
        that:
          - passbolt_db_name is defined and passbolt_db_name | length > 0
          - passbolt_db_user is defined and passbolt_db_user | length > 0
          - passbolt_db_password is defined and passbolt_db_password | length > 0
        fail_msg: >-
          Faltan credenciales. Defínelas con -e o desde Ansible Vault:
          passbolt_db_name, passbolt_db_user, passbolt_db_password
        quiet: true

    - name: 0.2 Validar longitud mínima de contraseña
      ansible.builtin.assert:
        that:
          - passbolt_db_password | length >= 12
        fail_msg: "La contraseña de BD debe tener al menos 12 caracteres."
        quiet: true

    # ============ 1. LIMPIEZA / DESINSTALACIÓN PREVIA ============
    - name: 1.1 Detener servicios de Passbolt si existen
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - nginx
        - php8.3-fpm
      failed_when: false

    - name: 1.2 Purgar paquete passbolt-ce-server (si está instalado)
      ansible.builtin.apt:
        name: passbolt-ce-server
        state: absent
        purge: true
        autoremove: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: 1.3 Eliminar restos de configuración de Passbolt
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/passbolt
        - /usr/share/php/passbolt
        - /var/lib/passbolt
        - /var/log/passbolt
        - /var/cache/passbolt
        - /tmp/passbolt-repo-setup.ce.sh

    - name: 1.4 Eliminar repositorio y key de Passbolt
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/passbolt.list
        - /etc/apt/sources.list.d/passbolt-ce.list
        - /etc/apt/trusted.gpg.d/passbolt.gpg
        - /etc/apt/trusted.gpg.d/passbolt.asc
        - /usr/share/keyrings/passbolt-archive-keyring.gpg

    - name: 1.5 Eliminar base de datos y usuario de Passbolt
      ansible.builtin.shell: |
        mysql << 'SQLEOF'
        DROP DATABASE IF EXISTS `{{ passbolt_db_name }}`;
        DROP USER IF EXISTS '{{ passbolt_db_user }}'@'localhost';
        FLUSH PRIVILEGES;
        SQLEOF
      changed_when: true
      failed_when: false
      no_log: true

    - name: 1.6 Actualizar cache APT tras limpieza
      ansible.builtin.apt:
        update_cache: true

    # ============ 2. PRE-REQUISITOS ============
    - name: 2.1 Instalar dependencias base
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - mysql-server
          - python3-pymysql
        state: present

    - name: 2.2 Asegurar MySQL iniciado
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true

    # ============ 3. REPOSITORIO PASSBOLT ============
    - name: 3.1 Descargar script del repositorio oficial
      ansible.builtin.get_url:
        url: "https://download.passbolt.com/ce/installer/passbolt-repo-setup.ce.sh"
        dest: "/tmp/passbolt-repo-setup.ce.sh"
        mode: '0755'

    - name: 3.2 Ejecutar script del repositorio
      ansible.builtin.command:
        cmd: bash /tmp/passbolt-repo-setup.ce.sh
        chdir: /tmp
        creates: /etc/apt/sources.list.d/passbolt.list

    # ============ 4. INSTALAR PAQUETE ============
    - name: 4.1 Instalar passbolt-ce-server sin debconf interactivo
      ansible.builtin.apt:
        name: passbolt-ce-server
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    # ============ 5. CONFIGURAR BASE DE DATOS ============
    - name: 5.1 Crear base de datos y usuario en MySQL
      ansible.builtin.shell: |
        mysql << 'SQLEOF'
        CREATE DATABASE IF NOT EXISTS `{{ passbolt_db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS '{{ passbolt_db_user }}'@'localhost' IDENTIFIED BY '{{ passbolt_db_password }}';
        GRANT ALL PRIVILEGES ON `{{ passbolt_db_name }}`.* TO '{{ passbolt_db_user }}'@'localhost';
        FLUSH PRIVILEGES;
        SQLEOF
      changed_when: true
      no_log: true

    # ============ 6. CONFIGURACIÓN PASSBOLT ============
    - name: 6.1 Crear passbolt.php con permisos correctos
      ansible.builtin.copy:
        dest: /etc/passbolt/passbolt.php
        owner: www-data
        group: www-data
        mode: '0440'
        content: |
          <?php
          return [
              'App' => [
                  'fullBaseUrl' => 'http://{{ passbolt_domain }}',
              ],
              'Datasources' => [
                  'default' => [
                      'host' => '127.0.0.1',
                      'port' => '3306',
                      'username' => '{{ passbolt_db_user }}',
                      'password' => '{{ passbolt_db_password }}',
                      'database' => '{{ passbolt_db_name }}',
                  ],
              ],
          ];
      no_log: true

    - name: 6.2 Ejecutar migraciones de Passbolt
      ansible.builtin.command:
        cmd: sudo -H -u www-data bash -c "/usr/share/php/passbolt/bin/cake passbolt migrate"
      register: migrate_out
      changed_when: "'No migration' not in migrate_out.stdout"

    # ============ 7. SERVICIOS ============
    - name: 7.1 Asegurar servicios corriendo
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop:
        - nginx
        - mysql
        - php8.3-fpm

    # ============ 8. VERIFICACIÓN ============
    - name: 8.1 Healthcheck final
      ansible.builtin.command:
        cmd: sudo -u www-data -s /bin/bash -c "/usr/share/php/passbolt/bin/cake passbolt healthcheck"
      register: healthcheck
      changed_when: false
      failed_when: false

    - name: 8.2 Mostrar resumen del healthcheck
      ansible.builtin.debug:
        msg: "{{ healthcheck.stdout_lines | select('search', 'OK|FAIL|WARN|PASS') | list }}"

    - name: 8.3 Mostrar URL de acceso
      ansible.builtin.debug:
        msg: "Passbolt listo en: http://{{ passbolt_domain }}"