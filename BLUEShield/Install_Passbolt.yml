---
- name: Reinstalar Passbolt CE en Ubuntu desde cero
  hosts: all
  become: true
  gather_facts: true

  vars:
    passbolt_domain: "{{ ansible_default_ipv4.address | default('localhost') }}"
    passbolt_db_name: "passbolt"
    passbolt_db_user: "passbolt"
    passbolt_secret_file: "/etc/passbolt/.db_password"

  tasks:
    # ============ 0. AUTO-GENERAR / LEER CONTRASEÑA ============
    - name: 0.1 Comprobar si ya existe el secreto de BD en el host
      ansible.builtin.stat:
        path: "{{ passbolt_secret_file }}"
      register: secret_stat

    - name: 0.2 Generar contraseña aleatoria si no existe
      ansible.builtin.set_fact:
        passbolt_db_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when: not secret_stat.stat.exists

    - name: 0.3 Leer contraseña existente si ya estaba guardada
      ansible.builtin.slurp:
        src: "{{ passbolt_secret_file }}"
      register: secret_slurp
      when: secret_stat.stat.exists

    - name: 0.4 Fijar contraseña leída
      ansible.builtin.set_fact:
        passbolt_db_password: "{{ secret_slurp.content | b64decode | trim }}"
      when: secret_stat.stat.exists

    - name: 0.5 Asegurar directorio /etc/passbolt
      ansible.builtin.file:
        path: /etc/passbolt
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: 0.6 Guardar contraseña en el host (solo root)
      ansible.builtin.copy:
        dest: "{{ passbolt_secret_file }}"
        content: "{{ passbolt_db_password }}"
        owner: root
        group: root
        mode: '0600'
      when: not secret_stat.stat.exists

    # ============ 1. LIMPIEZA FORZADA (SIN APT) ============
    - name: 1.0 Buscar TODOS los archivos de repositorio de Passbolt
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d/
        patterns: "passbolt*"
      register: passbolt_repo_files

    - name: 1.1 Borrar archivos de repositorio de Passbolt encontrados
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ passbolt_repo_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: 1.2 Borrar TODAS las claves GPG de Passbolt
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/trusted.gpg.d/passbolt.gpg
        - /etc/apt/trusted.gpg.d/passbolt.asc
        - /usr/share/keyrings/passbolt-archive-keyring.gpg
        - /usr/share/keyrings/passbolt-repository.gpg
        - /etc/apt/keyrings/passbolt-archive-keyring.gpg
        - /etc/apt/keyrings/passbolt-repository.gpg

    - name: 1.3 Detener servicios de Passbolt si existen
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: [nginx, php8.3-fpm]
      failed_when: false

    - name: 1.4 Purgar paquete passbolt-ce-server (ahora APT ya no tiene conflicto)
      ansible.builtin.apt:
        name: passbolt-ce-server
        state: absent
        purge: true
        autoremove: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: 1.5 Eliminar restos de configuración
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/php/passbolt
        - /var/lib/passbolt
        - /var/log/passbolt
        - /var/cache/passbolt
        - /tmp/passbolt-repo-setup.ce.sh

    - name: 1.6 DROP DATABASE / DROP USER previos
      ansible.builtin.shell: |
        mysql << 'SQLEOF'
        DROP DATABASE IF EXISTS `{{ passbolt_db_name }}`;
        DROP USER IF EXISTS '{{ passbolt_db_user }}'@'localhost';
        FLUSH PRIVILEGES;
        SQLEOF
      changed_when: true
      failed_when: false
      no_log: true

    - name: 1.7 Actualizar cache APT tras limpieza
      ansible.builtin.apt:
        update_cache: true

    # ============ 2. PRE-REQUISITOS ============
    - name: 2.1 Instalar dependencias base
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - apt-transport-https
          - mysql-server
          - python3-pymysql
        state: present

    - name: 2.2 Asegurar MySQL iniciado
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true

    # ============ 3. REPOSITORIO PASSBOLT (SUITE focal) ============
    - name: 3.1 Importar clave GPG de Passbolt
      ansible.builtin.shell: |
        curl -fsSL https://download.passbolt.com/pub.key | gpg --dearmor -o /usr/share/keyrings/passbolt-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/passbolt-archive-keyring.gpg
      changed_when: true

    - name: 3.2 Añadir repositorio de Passbolt (focal, compatible con noble)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/passbolt.list
        content: |
          deb [signed-by=/usr/share/keyrings/passbolt-archive-keyring.gpg] https://download.passbolt.com/ce/ubuntu focal main
        mode: '0644'

    - name: 3.3 Actualizar cache APT con repositorio de Passbolt
      ansible.builtin.apt:
        update_cache: true

    # ============ 4. INSTALAR PAQUETE ============
    - name: 4.1 Instalar passbolt-ce-server
      ansible.builtin.apt:
        name: passbolt-ce-server
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    # ============ 5. CREAR BD Y USUARIO ============
    - name: 5.1 Crear base de datos y usuario en MySQL
      ansible.builtin.shell: |
        mysql << 'SQLEOF'
        CREATE DATABASE IF NOT EXISTS `{{ passbolt_db_name }}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        CREATE USER IF NOT EXISTS '{{ passbolt_db_user }}'@'localhost' IDENTIFIED BY '{{ passbolt_db_password }}';
        GRANT ALL PRIVILEGES ON `{{ passbolt_db_name }}`.* TO '{{ passbolt_db_user }}'@'localhost';
        FLUSH PRIVILEGES;
        SQLEOF
      changed_when: true
      no_log: true

    # ============ 6. CONFIGURACIÓN ============
    - name: 6.1 Crear passbolt.php
      ansible.builtin.copy:
        dest: /etc/passbolt/passbolt.php
        owner: www-data
        group: www-data
        mode: '0440'
        content: |
          <?php
          return [
              'App' => [
                  'fullBaseUrl' => 'http://{{ passbolt_domain }}',
              ],
              'Datasources' => [
                  'default' => [
                      'host' => '127.0.0.1',
                      'port' => '3306',
                      'username' => '{{ passbolt_db_user }}',
                      'password' => '{{ passbolt_db_password }}',
                      'database' => '{{ passbolt_db_name }}',
                  ],
              ],
          ];
      no_log: true

    - name: 6.2 Ejecutar migraciones
      ansible.builtin.command:
        cmd: sudo -H -u www-data bash -c "/usr/share/php/passbolt/bin/cake passbolt migrate"
      register: migrate_out
      changed_when: "'No migration' not in migrate_out.stdout"

    # ============ 7. SERVICIOS ============
    - name: 7.1 Asegurar servicios corriendo
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: [nginx, mysql, php8.3-fpm]

    # ============ 8. VERIFICACIÓN ============
    - name: 8.1 Healthcheck
      ansible.builtin.command:
        cmd: sudo -u www-data -s /bin/bash -c "/usr/share/php/passbolt/bin/cake passbolt healthcheck"
      register: healthcheck
      changed_when: false
      failed_when: false

    - name: 8.2 Resumen healthcheck
      ansible.builtin.debug:
        msg: "{{ healthcheck.stdout_lines | select('search', 'OK|FAIL|WARN|PASS') | list }}"

    - name: 8.3 URL de acceso
      ansible.builtin.debug:
        msg: "Passbolt listo en: http://{{ passbolt_domain }}"