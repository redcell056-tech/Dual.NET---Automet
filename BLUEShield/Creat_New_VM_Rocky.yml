---
- name: Crear VM Rocky Linux (Mínimos) - Receta Zabbix
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: "!Urielito2001"
    vm_name: "rocky-gui-09"  # Nombre nuevo para evitar conflictos
    datastore: "datastore1"
    # Asegúrate de que este sea el nombre exacto de tu ISO de Rocky
    iso_rel_path: "ISOS/Rocky-9.6-x86_64-minimal.iso"

  tasks:
    # 1. Crear la VM con los mínimos
    - name: Crear la VM en ESXi
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "rhel9_64Guest"   # Identificador correcto para Rocky 9
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048           # 2 GB RAM
          num_cpus: 2               # 2 vCPUs
        disk:
          - size_gb: 20             # 20 GB de disco
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result
      vars:
        ansible_python_interpreter: /usr/local/bin/python

    # 2. Corregir el .vmx con la receta exacta y encender
    - name: Corregir .vmx y encender (Receta Zabbix)
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}')
        
        # Apagamos por si el módulo la encendió con la config mala
        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 3

        # AQUÍ ESTÁ LA CORRECCIÓN: Usamos la ruta completa con el datastore
        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        # Limpieza profunda: quitamos CUALQUIER rastro del CD-ROM anterior
        sed -i '/^ide[01]:[0-9]\./d' "$VMX"
        sed -i '/^sata[0-9]:[0-9]\./d' "$VMX"
        sed -i '/^firmware/d' "$VMX"
        sed -i '/^bios.bootOrder/d' "$VMX"
        sed -i '/^bios.bootDeviceClasses/d' "$VMX"
        # Por si acaso, borramos también la línea 'filename' en minúscula que a veces deja Ansible
        sed -i '/filename.*Rocky/d' "$VMX"

        # Escritura de la receta exacta de Zabbix (ruta completa)
        cat >> "$VMX" << 'EOF'
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.filename = "/vmfs/volumes/{{ datastore }}/{{ iso_rel_path }}"
        EOF

        echo "=== Configuración final en el .vmx ==="
        grep -E "ide0:0" "$VMX"

        # Recargamos y encendemos
        vim-cmd vmsvc/reload $VMID
        sleep 2
        vim-cmd vmsvc/power.on $VMID
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'