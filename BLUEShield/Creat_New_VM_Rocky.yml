---
- name: Crear VM Rocky Linux (Configuración Forzada Definitiva)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: "!Urielito2001"
    vm_name: "rocky-server-final"  # Nombre nuevo para evitar conflictos
    datastore: "datastore1"
    # Ruta relativa al datastore (sin "datastore1/" al principio)
    iso_rel_path: "ISOS/Rocky-9.6-x86_64-minimal.iso"

  tasks:
    # 1. Crear la máquina virtual
    - name: Crear la VM en ESXi
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "rhel9_64Guest"
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048
          num_cpus: 2
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result
      vars:
        ansible_python_interpreter: /usr/local/bin/python

    # 2. Corregir el .vmx con precisión quirúrgica y encender
    - name: Corregir .vmx y encender la VM
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}')
        
        # Apagamos por si el módulo la encendió con la config mala
        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 3

        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        # --- LIMPIEZA EXTREMA ---
        # Creamos un archivo temporal sin NINGUNA línea que contenga ide, sata, cdrom, firmware o boot
        grep -v -E "ide[01]:[0-9]|sata[0-9]:[0-9]|cdrom|firmware|bios\.boot" "$VMX" > "${VMX}.tmp"
        mv "${VMX}.tmp" "$VMX"

        # --- ESCRITURA DE LA RECETA EXACTA (Idéntica a Ubuntu-ZABBIX) ---
        cat >> "$VMX" << 'EOF'
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.filename = "/vmfs/volumes/{{ datastore }}/{{ iso_rel_path }}"
        EOF

        echo "=== Configuración final en el .vmx ==="
        grep -E "ide0:0" "$VMX"

        # Recargamos la configuración y encendemos
        vim-cmd vmsvc/reload $VMID
        sleep 3
        vim-cmd vmsvc/power.on $VMID
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'