---
- name: Crear VM Rocky Linux (Mínimos) - Configuración Forzada
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: "!Urielito2001"
    vm_name: "rocky-gui-10"  # Nombre nuevo para no chocar con las anteriores
    datastore: "datastore1"
    # Ruta relativa al datastore, SIN el nombre del datastore al principio
    iso_rel_path: "ISOS/Rocky-9.6-x86_64-minimal.iso"

  tasks:
    # 1. Crear la VM
    - name: Crear la VM en ESXi
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "rhel9_64Guest"
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048
          num_cpus: 2
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result
      vars:
        ansible_python_interpreter: /usr/local/bin/python

    # 2. Corregir el .vmx a la fuerza (Limpieza total y reescritura)
    - name: Forzar configuración correcta del .vmx
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}')
        
        # Apagar la VM
        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 3

        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        # 1. Limpieza radical: Eliminamos CUALQUIER línea que contenga "ide" o "sata"
        sed -i '/ide[01]:[0-9]/d' "$VMX"
        sed -i '/sata[0-9]:[0-9]/d' "$VMX"
        
        # 2. Eliminamos configuraciones de arranque previas
        sed -i '/^firmware/d' "$VMX"
        sed -i '/^bios.bootOrder/d' "$VMX"
        sed -i '/^bios.bootDeviceClasses/d' "$VMX"
        sed -i '/^bios.forceSetupOnce/d' "$VMX"

        # 3. Escribimos la configuración idéntica a la de Ubuntu-ZABBIX (que sí funciona)
        cat >> "$VMX" << 'EOF'
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.filename = "/vmfs/volumes/{{ datastore }}/{{ iso_rel_path }}"
        EOF

        # 4. Forzamos que la BIOS se detenga al arrancar para que podamos verla
        echo 'bios.forceSetupOnce = "TRUE"' >> "$VMX"

        echo "=== Configuración final en el .vmx ==="
        grep -E "ide0:0|bios.forceSetupOnce" "$VMX"

        # 5. Recargamos la configuración y encendemos
        vim-cmd vmsvc/reload $VMID
        sleep 2
        vim-cmd vmsvc/power.on $VMID
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'