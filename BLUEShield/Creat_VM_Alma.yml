---
- name: Crear VM AlmaLinux (Forzando BIOS Legacy y Boot Order)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: "!Urielito2001"
    vm_name: "alma-server-final-02"  # Nombre nuevo
    datastore: "datastore1"
    iso_rel_path: "ISOS/AlmaLinux-9.6-x86_64-minimal (2).iso"

  tasks:
    - name: Crear la VM en ESXi
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "rhel9_64Guest"
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048
          num_cpus: 2
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result
      vars:
        ansible_python_interpreter: /usr/local/bin/python

    - name: Forzar BIOS Legacy y orden de arranque correcto
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | grep -w "{{ vm_name }}" | awk '{print $1}')
        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 3

        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        # Limpieza radical
        grep -v -E "ide[01]:[0-9]|sata[0-9]:[0-9]|cdrom|firmware|bios\.boot" "$VMX" > "${VMX}.tmp"
        mv "${VMX}.tmp" "$VMX"

        # Escritura de configuración con BIOS forzado y boot order
        cat >> "$VMX" << 'EOF'
        firmware = "bios"
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.filename = "/vmfs/volumes/{{ datastore }}/{{ iso_rel_path }}"
        ide0:0.startConnected = "TRUE"
        bios.bootOrder = "cdrom,hd"
        bios.bootDeviceClasses = "allow:cd,hd"
        EOF

        echo "=== Configuración final ==="
        grep -E "firmware|ide0:0|bios.boot" "$VMX"

        vim-cmd vmsvc/reload $VMID
        sleep 3
        vim-cmd vmsvc/power.on $VMID
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'