---
- name: Instalar Wazuh Manager All-in-One (Desatendido)
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    # 1. INSTALAR DEPENDENCIAS BÁSICAS
    - name: Instalar curl y dependencias necesarias
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: yes

    # 2. DESCARGAR EL SCRIPT DE INSTALACIÓN OFICIAL
    - name: Descargar el script de instalación de Wazuh
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/4.x/unattended-installation/wazuh-install.sh"
        dest: "/tmp/wazuh-install.sh"
        mode: '0755'

    # 3. EJECUTAR LA INSTALACIÓN ALL-IN-ONE
    # El flag -a instala Manager + Indexer + Dashboard en el mismo host.
    # El flag -i ignora el chequeo de hardware (útil si tu lab no llega a 8GB, aunque no es recomendable).
    - name: Ejecutar la instalación desatendida de Wazuh
      ansible.builtin.shell: |
        bash /tmp/wazuh-install.sh -a -i
      args:
        executable: /bin/bash
      register: wazuh_install_output
      failed_when: 
        - wazuh_install_output.rc != 0
        - "'Installation finished' not in wazuh_install_output.stdout"

    # 4. MOSTRAR LAS CREDENCIALES GENERADAS
    # El script genera contraseñas aleatorias para el admin. Las mostramos en el log.
    - name: Mostrar las credenciales de acceso (cópialas de aquí)
      ansible.builtin.debug:
        msg: 
          - "La instalación ha finalizado. Busca en el log de la tarea anterior las líneas que empiezan con:"
          - "'The password for admin is:'"
          - "'The password for wazuh is:'"
          - "Guarda esas contraseñas para acceder al Dashboard."

    # 5. VERIFICAR QUE EL SERVICIO ESTÁ ACTIVO
    - name: Verificar el estado del servicio wazuh-manager
      ansible.builtin.systemd:
        name: wazuh-manager
        state: started
        enabled: yes

    - name: Mostrar la URL del Dashboard
      ansible.builtin.debug:
        msg:
          - "Wazuh Dashboard disponible en: https://{{ ansible_default_ipv4.address }}"
          - "Usuario: admin"
          - "Contraseña: (revisa el log de la instalación, busca 'The password for admin is...')"