---
- name: Limpieza profunda antes de reinstalar Wazuh
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    # 1. DETENER CUALQUIER PROCESO DE WAZUH
    - name: Matar procesos de Wazuh y Ossec
      ansible.builtin.shell: |
        pkill -9 -f wazuh || true
        pkill -9 -f ossec || true
      changed_when: false

    # 2. DESINSTALAR PAQUETES (FORZANDO)
    - name: Forzar purga de paquetes de Wazuh
      ansible.builtin.shell: |
        dpkg --purge --force-all wazuh-dashboard wazuh-indexer wazuh-manager wazuh-agent filebeat 2>/dev/null || true
      changed_when: false

    # 3. ELIMINAR DIRECTORIOS DE WAZUH (LOS QUE OCUPAN MÁS ESPACIO)
    - name: Eliminar directorios de datos y configuración de Wazuh
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/ossec
        - /var/lib/wazuh-indexer
        - /var/lib/wazuh-dashboard
        - /etc/wazuh-indexer
        - /etc/wazuh-dashboard
        - /etc/wazuh
        - /usr/share/wazuh-indexer
        - /usr/share/wazuh-dashboard
        - /var/log/wazuh-indexer
        - /var/log/wazuh-dashboard
        - /var/log/wazuh-install.log
        - /tmp/wazuh-install.sh
        - /tmp/wazuh-install-files.tar
        - /tmp/wazuh-install-files

    # 4. LIMPIAR CACHÉ DE APT Y PAQUETES DESCARGADOS
    - name: Limpiar caché de APT y paquetes .deb
      ansible.builtin.shell: |
        apt-get clean
        rm -rf /var/cache/apt/archives/*.deb
        apt-get autoremove -y
      changed_when: false

    # 5. LIMPIAR TEMPORALES DE DPKG
    - name: Limpiar archivos temporales de dpkg
      ansible.builtin.shell: |
        rm -rf /var/lib/dpkg/tmp.ci
        rm -rf /var/lib/dpkg/info/*.dpkg-new
        rm -rf /var/lib/dpkg/info/*.dpkg-tmp
      changed_when: false

    # 6. LIMPIAR LOGS VIEJOS DEL SISTEMA (OPCIONAL, LIBERA ESPACIO)
    - name: Reducir logs del sistema
      ansible.builtin.shell: |
        journalctl --vacuum-size=50M
      changed_when: false

    # 7. REPARAR DPKG Y ACTUALIZAR
    - name: Reparar dpkg y actualizar índice
      ansible.builtin.shell: |
        dpkg --configure -a
        apt-get -f install -y
        apt-get update
      changed_when: false

    # 8. VERIFICAR ESPACIO LIBRE
    - name: Mostrar espacio libre en disco
      ansible.builtin.command: df -h
      register: disk_space
      changed_when: false

    - name: Resultado del espacio
      ansible.builtin.debug:
        msg: "{{ disk_space.stdout_lines }}"