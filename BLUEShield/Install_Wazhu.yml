---
- name: Instalar y configurar Wazuh Agent
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    # --- VARIABLE QUE EL USUARIO DEFINE AL EJECUTAR ---
    # Si el Manager está en el mismo servidor, usa "localhost" o "127.0.0.1"
    # Si está en otro host, pon su hostname o IP aquí.
    wazuh_manager: "192.168.1.70"  # <--- CAMBIA ESTO O DÉJALO VACÍO
    wazuh_agent_name: "{{ inventory_hostname }}"

  tasks:
    # 1. INSTALAR DEPENDENCIAS
    - name: Instalar dependencias necesarias (curl, gnupg)
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: yes

    # 2. AGREGAR LA CLAVE GPG DE WAZUH
    - name: Agregar la llave GPG de Wazuh
      ansible.builtin.shell: |
        curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import
        chmod 644 /usr/share/keyrings/wazuh.gpg
      args:
        creates: /usr/share/keyrings/wazuh.gpg

    # 3. AGREGAR EL REPOSITORIO DE WAZUH
    - name: Agregar el repositorio de Wazuh
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/wazuh.list
        content: |
          deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main
        mode: '0644'

    # 4. ACTUALIZAR EL ÍNDICE DE PAQUETES
    - name: Actualizar el índice de paquetes después de agregar el repo
      ansible.builtin.apt:
        update_cache: yes

    # 5. INSTALAR EL AGENTE DE WAZUH
    - name: Instalar el agente de Wazuh
      ansible.builtin.apt:
        name: wazuh-agent
        state: present

    # 6. CONFIGURAR EL AGENTE PARA APUNTAR AL MANAGER
    - name: Configurar la IP del Wazuh Manager en el agente
      ansible.builtin.lineinfile:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*</address>'
        line: "    <address>{{ wazuh_manager }}</address>"
        backup: yes

    # 7. HABILITAR E INICIAR EL SERVICIO
    - name: Recargar systemd y habilitar el servicio wazuh-agent
      ansible.builtin.systemd:
        name: wazuh-agent
        state: started
        enabled: yes
        daemon_reload: yes

    # 8. VERIFICAR EL ESTADO
    - name: Verificar que el agente de Wazuh está corriendo
      ansible.builtin.command: systemctl status wazuh-agent
      register: wazuh_status
      changed_when: false
      failed_when: wazuh_status.rc != 0

    - name: Mostrar el estado del agente de Wazuh
      ansible.builtin.debug:
        msg: "{{ wazuh_status.stdout_lines }}"