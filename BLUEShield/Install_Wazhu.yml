---
- name: Instalar Wazuh Manager All-in-One (Desatendido)
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    # 1. INSTALAR DEPENDENCIAS BÁSICAS
    - name: Instalar dependencias necesarias (curl, gnupg, apt-transport-https)
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: yes

    # 2. DESCARGAR EL SCRIPT DE INSTALACIÓN OFICIAL
    # Usamos la versión 4.14 que es la que ha funcionado en tus pruebas
    - name: Descargar el script de instalación de Wazuh (v4.14)
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/4.14/wazuh-install.sh"
        dest: "/tmp/wazuh-install.sh"
        mode: '0755'
        force: yes

    # 3. EJECUTAR LA INSTALACIÓN ALL-IN-ONE
    # -a: Instala Manager + Indexer + Dashboard en el mismo host
    # -i: Ignora el chequeo de hardware (útil si tu VM no llega a los 8GB recomendados)
    - name: Ejecutar la instalación desatendida de Wazuh
      ansible.builtin.shell: |
        bash /tmp/wazuh-install.sh -a -i
      args:
        executable: /bin/bash
      register: wazuh_install_output
      failed_when: 
        - wazuh_install_output.rc != 0
        - "'Installation finished' not in wazuh_install_output.stdout"

    # 4. MOSTRAR LAS CREDENCIALES GENERADAS
    # El script genera contraseñas aleatorias al final. Las mostramos en el log.
    - name: Mostrar las credenciales de acceso
      ansible.builtin.debug:
        msg: 
          - "La instalación ha finalizado. Busca en el log de la tarea anterior las líneas:"
          - "'The password for admin is:'"
          - "'The password for wazuh is:'"
          - "También puedes extraerlas con: tar -O -xvf /tmp/wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt"

    # 5. VERIFICAR QUE EL SERVICIO ESTÁ ACTIVO
    - name: Verificar que el servicio wazuh-manager esté activo
      ansible.builtin.systemd:
        name: wazuh-manager
        state: started
        enabled: yes

    # 6. MOSTRAR LA URL DEL DASHBOARD
    - name: Mostrar la URL del Dashboard
      ansible.builtin.debug:
        msg:
          - "Wazuh Dashboard disponible en: https://{{ ansible_default_ipv4.address }}"
          - "Usuario: admin"
          - "Contraseña: (extraer del log de instalación o del archivo wazuh-passwords.txt)"