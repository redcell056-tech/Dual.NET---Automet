---
- name: Eliminar completamente Wazuh (Manager, Indexer, Dashboard y Agente)
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    # 1. DETENER TODOS LOS SERVICIOS DE WAZUH
    - name: Detener los servicios de Wazuh (manager, indexer, dashboard, agent)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - wazuh-manager
        - wazuh-indexer
        - wazuh-dashboard
        - wazuh-agent
      ignore_errors: yes

    # 2. DESINSTALAR LOS PAQUETES DE WAZUH
    - name: Desinstalar paquetes de Wazuh
      ansible.builtin.apt:
        name:
          - wazuh-manager
          - wazuh-indexer
          - wazuh-dashboard
          - wazuh-agent
        state: absent
        purge: yes
        autoremove: yes

    # 3. ELIMINAR LOS REPOSITORIOS Y LLAVES DE WAZUH
    - name: Eliminar repositorio y llave de Wazuh
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/wazuh.list
        - /usr/share/keyrings/wazuh.gpg
        - /etc/apt/sources.list.d/wazuh-indexer.list
        - /etc/apt/sources.list.d/wazuh-dashboard.list
        - /usr/share/keyrings/wazuh-indexer.gpg
        - /usr/share/keyrings/wazuh-dashboard.gpg

    # 4. ELIMINAR DIRECTORIOS DE DATOS Y CONFIGURACIÓN
    - name: Eliminar directorios de datos y configuración de Wazuh
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/ossec
        - /var/lib/wazuh-indexer
        - /etc/wazuh-indexer
        - /etc/wazuh-dashboard
        - /usr/share/wazuh-indexer
        - /usr/share/wazuh-dashboard
        - /etc/wazuh
        - /var/log/wazuh-install.log
        - /tmp/wazuh-install.sh
        - /tmp/wazuh-install-files.tar

    # 5. RECARGAR EL ÍNDICE DE PAQUETES
    - name: Actualizar el índice de paquetes después de la limpieza
      ansible.builtin.apt:
        update_cache: yes

    # 6. VERIFICAR QUE NO QUEDEN SERVICIOS DE WAZUH
    - name: Verificar que no queden servicios de Wazuh
      ansible.builtin.shell: |
        systemctl list-units --all | grep -i wazuh || true
      register: wazuh_check
      changed_when: false

    - name: Mostrar el resultado de la verificación
      ansible.builtin.debug:
        msg: "{{ wazuh_check.stdout_lines if wazuh_check.stdout_lines else '✅ No quedan servicios de Wazuh.' }}"