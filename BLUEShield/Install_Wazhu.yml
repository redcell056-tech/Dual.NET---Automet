---
- name: Instalar Wazuh Manager All-in-One (Desatendido)
  hosts: all
  gather_facts: yes
  become: yes

  tasks:
    # 1. INSTALAR DEPENDENCIAS BÁSICAS
    - name: Instalar curl y dependencias necesarias
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
        state: present
        update_cache: yes

    # 2. DESCARGAR EL SCRIPT DE INSTALACIÓN (URL ESPECÍFICA QUE SÍ FUNCIONA)
    - name: Descargar el script de instalación de Wazuh (v4.14)
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/4.14/wazuh-install.sh"
        dest: "/tmp/wazuh-install.sh"
        mode: '0755'

    # 3. EJECUTAR LA INSTALACIÓN ALL-IN-ONE
    - name: Ejecutar la instalación desatendida de Wazuh
      ansible.builtin.shell: |
        bash /tmp/wazuh-install.sh -a -i
      args:
        executable: /bin/bash
      register: wazuh_install_output
      failed_when: 
        - wazuh_install_output.rc != 0
        - "'Installation finished' not in wazuh_install_output.stdout"

    # 4. MOSTRAR LAS CREDENCIALES GENERADAS
    - name: Mostrar las credenciales de acceso
      ansible.builtin.debug:
        msg: 
          - "La instalación ha finalizado. Busca en el log las líneas con 'The password for admin is:' y 'The password for wazuh is:'"
          - "También puedes extraerlas con: tar -O -xvf /tmp/wazuh-install-files.tar wazuh-install-files/wazuh-passwords.txt"

    # 5. VERIFICAR QUE EL SERVICIO ESTÁ ACTIVO
    - name: Verificar el estado del servicio wazuh-manager
      ansible.builtin.systemd:
        name: wazuh-manager
        state: started
        enabled: yes

    - name: Mostrar la URL del Dashboard
      ansible.builtin.debug:
        msg:
          - "Wazuh Dashboard disponible en: https://{{ ansible_default_ipv4.address }}"
          - "Usuario: admin"
          - "Contraseña: (extraer del archivo wazuh-passwords.txt)"