---
- name: Crear VM Ubuntu con autoinstall (DHCP + open-vm-tools) y configurar Zabbix
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    esxiaddr: "192.168.1.67"
    esxiuser: "root"
    esxipass: '!Urielito2001'
    vm_name: "ubuntu-gui-final"
    datastore: "datastore1"
    iso_rel_path: "ISOS/ubuntu-24.04.2-live-server-amd64.iso"
    seed_dir: "/tmp/ubuntu-seed-{{ vm_name }}"
    seed_iso_local: "/tmp/{{ vm_name }}-seed.iso"
    seed_iso_datastore: "seed-{{ vm_name }}.iso"
    
    # --- NUEVO USUARIO Y CONTRASEÑA ---
    ubuntu_user: "redcell"
    # Hash generado con: openssl passwd -6 '!Urielito2001'
    ubuntu_pass_hash: "$6$TSdKIBtDj1eTkodP$fEiWUkgXCdoN4BQukMLd4Hh8vH1Scuz73wn9D7NZkx.xbOX.ZNIcQ/jYSjNWD.CRknG5e3GLZfCkC2caL3peL0"
    
    ansible_ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10"

  tasks:
    - name: Verificar que genisoimage existe en localhost
      command: which genisoimage
      register: chk_geniso
      changed_when: false
      failed_when: chk_geniso.rc != 0

    - name: Verificar que sshpass existe en localhost
      command: which sshpass
      register: chk_sshpass
      changed_when: false
      failed_when: chk_sshpass.rc != 0

    - name: Destruir VM anterior si existe
      shell: |
        VMID=$(vim-cmd vmsvc/getallvms | awk -v n="{{ vm_name }}" '$2 == n {print $1; exit}')
        if [ -n "$VMID" ]; then
          vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
          sleep 2
          vim-cmd vmsvc/destroy $VMID || true
          echo "VM anterior destruida (VMID: $VMID)"
        else
          echo "No existía VM previa"
        fi
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: "{{ ansible_ssh_args }}"
      changed_when: false

    - name: Crear directorio para seed
      file:
        path: "{{ seed_dir }}"
        state: directory
        mode: "0755"

    - name: Escribir user-data (autoinstall + bootcmd + DHCP + open-vm-tools + SSH)
      copy:
        dest: "{{ seed_dir }}/user-data"
        mode: "0644"
        content: |
          #cloud-config
          bootcmd:
            - cat /proc/cmdline > /tmp/cmdline
            - sed -i'' 's/$/ autoinstall/g' /tmp/cmdline
            - mount -n --bind -o ro /tmp/cmdline /proc/cmdline
          autoinstall:
            version: 1
            identity:
              hostname: {{ vm_name }}
              username: {{ ubuntu_user }}
              password: "{{ ubuntu_pass_hash }}"
            ssh:
              install-server: true
              allow-pw: true
            storage:
              layout:
                name: direct
            late-commands:
              - curtin in-target --target=/target -- apt-get update
              - curtin in-target --target=/target -- apt-get install -y open-vm-tools

    - name: Escribir meta-data (vacío)
      copy:
        dest: "{{ seed_dir }}/meta-data"
        mode: "0644"
        content: ""

    - name: Eliminar seed ISO anterior si existe (para forzar regeneración)
      file:
        path: "{{ seed_iso_local }}"
        state: absent

    - name: Generar seed ISO localmente
      command: >
        genisoimage -output {{ seed_iso_local }} -volid cidata -joliet -rock
        {{ seed_dir }}/user-data {{ seed_dir }}/meta-data

    - name: Subir seed ISO al datastore de ESXi
      shell: |
        sshpass -p '{{ esxipass }}' scp \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          {{ seed_iso_local }} {{ esxiuser }}@{{ esxiaddr }}:/vmfs/volumes/{{ datastore }}/{{ seed_iso_datastore }}
      args:
        executable: /bin/bash

    - name: Crear la VM en ESXi (con ISO de Ubuntu montada)
      zaki_lknr.esxissh.esxissh_guest:
        esxiaddress: "{{ esxiaddr }}"
        esxiusername: "{{ esxiuser }}"
        esxipassword: "{{ esxipass }}"
        name: "{{ vm_name }}"
        guest_id: "ubuntu64Guest"
        datastore: "{{ datastore }}"
        hardware:
          memory_mb: 2048
          num_cpus: 2
        disk:
          - size_gb: 20
            type: thin
        networks:
          - name: "VM Network"
            device_type: "vmxnet3"
        cdrom:
          - type: "iso"
            iso_path: "{{ iso_rel_path }}"
        state: present
      register: vm_result

    - name: Configurar CD-ROMs y boot order en el .vmx
      shell: |
        set -e
        VMID=$(vim-cmd vmsvc/getallvms | awk -v n="{{ vm_name }}" '$2 == n {print $1; exit}')
        if [ -z "$VMID" ]; then
          echo "ERROR: no se encontró VMID para {{ vm_name }}"
          exit 1
        fi
        echo "VMID {{ vm_name }} = $VMID"

        vim-cmd vmsvc/power.off $VMID 2>/dev/null || true
        sleep 2

        VMX="/vmfs/volumes/{{ datastore }}/{{ vm_name }}/{{ vm_name }}.vmx"

        sed -i '/^ide[01]:[0-9]\./d' "$VMX"
        sed -i '/^sata[0-9]:[0-9]\./d' "$VMX"
        sed -i '/^bios.bootOrder/d' "$VMX"

        cat >> "$VMX" << EOF
        ide0:0.present = "TRUE"
        ide0:0.deviceType = "cdrom-image"
        ide0:0.filename = "/vmfs/volumes/{{ datastore }}/{{ iso_rel_path }}"
        EOF

        cat >> "$VMX" << EOF
        ide0:1.present = "TRUE"
        ide0:1.deviceType = "cdrom-image"
        ide0:1.filename = "/vmfs/volumes/{{ datastore }}/{{ seed_iso_datastore }}"
        EOF

        echo 'bios.bootOrder = "cdrom,hdd"' >> "$VMX"

        vim-cmd vmsvc/reload $VMID
        sleep 2
        vim-cmd vmsvc/power.on $VMID
      args:
        executable: /bin/sh
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: "{{ ansible_ssh_args }}"

    - name: Esperar a que la VM termine autoinstall y obtenga IP
      shell: |
        VMID=$(vim-cmd vmsvc/getallvms | awk -v n="{{ vm_name }}" '$2 == n {print $1; exit}')
        for i in $(seq 1 120); do
          OUT=$(vim-cmd vmsvc/get.guest $VMID 2>/dev/null || true)
          IP=$(echo "$OUT" | grep -m1 'ipAddress = "' | sed 's/.*ipAddress = "\(.*\)".*/\1/')
          STATE=$(echo "$OUT" | grep -m1 'guestState = "' | sed 's/.*guestState = "\(.*\)".*/\1/')
          if [ -n "$IP" ] && [ "$IP" != "0.0.0.0" ] && [ "$IP" != "127.0.0.1" ]; then
            echo "IP=$IP STATE=$STATE"
            exit 0
          fi
          echo "[$i/120] STATE=$STATE IP=${IP:-none}"
          sleep 10
        done
        echo "TIMEOUT esperando IP"
        exit 1
      register: vm_ip_out
      delegate_to: "{{ esxiaddr }}"
      connection: ssh
      vars:
        ansible_ssh_user: "{{ esxiuser }}"
        ansible_ssh_pass: "{{ esxipass }}"
        ansible_ssh_common_args: "{{ ansible_ssh_args }}"
      changed_when: false

    - name: Extraer IP
      set_fact:
        vm_ip: "{{ vm_ip_out.stdout | regex_search('IP=([0-9.]+)', '\\1') | first }}"

    - name: Mostrar IP obtenida
      debug:
        msg: "VM {{ vm_name }} lista con IP {{ vm_ip }}"

    - name: Añadir VM al inventario dinámico
      add_host:
        name: "{{ vm_ip }}"
        groups: ubuntu_vm
        ansible_user: "{{ ubuntu_user }}"
        # Aquí va la contraseña real en texto plano para que Ansible se conecte
        ansible_password: "!Urielito2001"
        ansible_ssh_common_args: "{{ ansible_ssh_args }}"
        ansible_python_interpreter: /usr/bin/python3

    - name: Esperar a que SSH esté disponible en la VM
      wait_for:
        host: "{{ vm_ip }}"
        port: 22
        delay: 5
        timeout: 600
        state: started

# =========================================================
# CONFIGURACIÓN POST-INSTALACIÓN (Zabbix y Sudo)
# =========================================================
- name: Configurar Zabbix y dar permisos SUDO a redcell
  hosts: ubuntu_vm
  become: yes
  gather_facts: yes
  tasks:
    # Es normal que justo después de instalar, apt esté bloqueado. Esto espera a que se libere.
    - name: Esperar a que el gestor de paquetes se libere
      shell: while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done;
      changed_when: false

    - name: Asegurar que redcell esté en el grupo sudo (Administrador)
      user:
        name: "{{ ubuntu_user }}"
        groups: sudo
        append: yes
        shell: /bin/bash

    # Opcional: Evita que pida contraseña al usar sudo
    - name: Permitir a redcell usar sudo sin contraseña (NOPASSWD)
      copy:
        dest: "/etc/sudoers.d/90-redcell-nopasswd"
        content: "{{ ubuntu_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Actualizar cache de apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar zabbix-agent
      apt:
        name: zabbix-agent
        state: present

    - name: Habilitar y arrancar zabbix-agent
      systemd:
        name: zabbix-agent
        enabled: yes
        state: started

    - name: Verificar IP de la VM
      command: hostname -I
      register: ip_check
      changed_when: false

    - name: Mostrar resultado final
      debug:
        msg: "VM {{ inventory_hostname }} lista. Usuario: {{ ubuntu_user }}. IP: {{ ip_check.stdout }}"